<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Test prix du marché</title>
<style>
  body { font-family: system-ui, sans-serif; background: #111; color: #eee; padding: 16px; font-size: 16px; }
  input, button { font-size: 16px; padding: 8px; margin: 4px 0; width: 100%; box-sizing: border-box; }
  pre { white-space: pre-wrap; background: #222; padding: 12px; border-radius: 8px; font-size: 14px; }
</style>
</head>
<body>
<h2>Test prix du marché</h2>
<input id="ville" value="Fréjus" />
<input id="cp" value="83600" />
<button onclick="lancer()">Lancer le test</button>
<pre id="out">Appuie sur « Lancer le test ».</pre>
<script>
const out = document.getElementById("out");
const log = (t) => { out.textContent += t + "\n"; };
async function lancer() {
  out.textContent = "";
  const ville = document.getElementById("ville").value.trim();
  const cp = document.getElementById("cp").value.trim();
  try {
    const page = await (await fetch("/?t=" + Date.now(), { cache: "no-store" })).text();
    const m = page.match(/assets\/(index-[^"']+\.js)/);
    log("1. Version de l'app en ligne : " + (m ? m[1] : "introuvable"));
  } catch (e) { log("1. ERREUR version : " + e.message); }
  let code = null;
  try {
    const t0 = Date.now();
    const r = await fetch(`/api/dvf?ville=${encodeURIComponent(ville)}&cp=${encodeURIComponent(cp)}`);
    const d = await r.json();
    code = d.code_insee;
    log(`2. Code commune : ${code} (statut ${r.status}, ${Date.now() - t0} ms)`);
  } catch (e) { log("2. ERREUR code commune : " + e.message); return; }
  if (!code) { log("2. Pas de code commune trouvé -> c'est ça le problème"); return; }
  try {
    const t0 = Date.now();
    const annee = new Date().getFullYear() - 4;
    const r = await fetch(`/api/dvf?code_insee=${code}&codtypbien=111&anneemut_min=${annee}&page=1`);
    log(`3. Ventes : statut ${r.status}, ${Date.now() - t0} ms`);
    const d = await r.json();
    const prix = (d.results || []).filter(v => v.libnatmut === "Vente" && v.codtypbien === "111" && Number(v.anneemut) >= annee)
      .map(v => Number(v.valeurfonc) / Number(v.sbati)).filter(p => p > 500 && p < 15000).sort((a, b) => a - b);
    log(`3. ${d.count} ventes reçues, ${prix.length} gardées`);
    if (prix.length) log(`4. Prix médian maison : ${Math.round(prix[Math.floor(prix.length / 2)])} €/m²`);
  } catch (e) { log("3. ERREUR ventes : " + e.message); }
}
</script>
</body>
</html>
