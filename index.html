<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0f172a" />
    <title>Exion Immo</title>
    <meta name="description" content="Exion Immo analyse ton projet d'investissement locatif : prix du marché, loyers, travaux, crédit et rentabilité, en quelques secondes." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
    <link rel="preload" as="image" href="/img/hero.webp" fetchpriority="high" />
  </head>
  <script>
(function () {
  try {
    var d = new Date();
    var mois = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
    var id = localStorage.getItem('exion_vid');
    if (!id) {
      id = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : Date.now() + '-' + Math.random().toString(36).slice(2);
      localStorage.setItem('exion_vid', id);
    }
    if (localStorage.getItem('exion_vmois') === mois) return;
    fetch('https://primary-production-a6e13.up.railway.app/webhook/visite', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ visiteur_id: id, mois: mois })
    }).then(function (r) {
      if (r.ok) localStorage.setItem('exion_vmois', mois);
    }).catch(function () {});
  } catch (e) {}
})();
</script>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
